<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>DeepSeek</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#6b7280;--line:#e5e7eb;--soft:#f4f4f5;--acc:#0b7fff;--err:#dc2626;--sT:env(safe-area-inset-top,0px);--sB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header,footer{flex:none}
header{display:flex;align-items:center;gap:8px;padding:calc(var(--sT) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
header b{font-size:15px;font-weight:600}
header .sp{flex:1}
#dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;transition:.2s}
#dot.w{background:#f59e0b;animation:p 1.1s infinite}
#dot.r{background:#10b981}
#dot.e{background:var(--err)}
@keyframes p{50%{opacity:.25}}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px 12px 6px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
#log:empty::after{content:"Ask anything…";color:var(--mut);margin:auto;font-size:14px}
.u,.a{max-width:90%;border-radius:15px;overflow-wrap:anywhere;animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}}
.u{align-self:flex-end;background:var(--fg);color:#fff;border-bottom-right-radius:4px;padding:8px 12px;white-space:pre-wrap}
.a{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px;padding:0}
.a .think{display:none;padding:8px 12px;font-size:13px;color:#6b7280;border-bottom:1px dashed var(--line);white-space:pre-wrap;font-style:italic}
.a .think.on{display:block}
.a .resp{padding:8px 12px}
.err{align-self:center;color:var(--err);background:#fef2f2;border:1px solid #fee2e2;font-size:13px;padding:6px 11px;border-radius:9px;max-width:95%}
.a p{margin:0 0 5px}.a p:last-child{margin:0}
.a ul{margin:3px 0 5px;padding-left:18px}
.a h1,.a h2,.a h3{margin:8px 0 3px;line-height:1.3}
.a h1{font-size:1.2em}.a h2{font-size:1.1em}.a h3{font-size:1em}
.a code{font-family:ui-monospace,Menlo,monospace;font-size:.87em;background:#e6e6e8;padding:1px 4px;border-radius:3px}
.a a{color:var(--acc)}
.cb{position:relative;margin:6px 0}
.cb pre{background:#0d1117;color:#c9d1d9;padding:26px 11px 9px;border-radius:8px;overflow-x:auto;margin:0;font-size:12.5px;line-height:1.45}
.cb pre code{background:none;padding:0;color:inherit;font-size:inherit;font-family:ui-monospace,Menlo,monospace}
.cp{position:absolute;top:5px;right:5px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:6px;font:inherit;font-size:11px;padding:2px 8px;cursor:pointer;z-index:1;line-height:1.6}
.cp:active{background:#30363d}
footer{padding:6px 10px calc(var(--sB) + 6px);border-top:1px solid var(--line)}
#toggles{display:flex;gap:6px;padding:0 4px 6px}
.tg{border:1px solid var(--line);background:#fff;border-radius:11px;padding:3px 10px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer}
.tg.on{background:#111;color:#fff;border-color:#111}
#chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 4px 4px}
.chip{background:#e8edff;border:1px solid #d4d9f0;border-radius:11px;padding:1px 8px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.chip button{background:none;border:0;color:#b91c1c;font-size:13px;cursor:pointer;padding:0 2px}
#f .row{display:flex;align-items:flex-end;gap:5px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px 4px 4px 6px}
#f .row:focus-within{border-color:#bbb}
#clip{border:0;background:none;color:var(--mut);font-size:17px;padding:5px 6px;cursor:pointer;border-radius:6px}
#clip:hover{background:#e6e6e8;color:var(--fg)}
#q{flex:1;border:0;background:none;outline:0;resize:none;font:inherit;padding:5px 3px;max-height:110px;color:inherit}
#q::placeholder{color:#9ca3af}
#s{border:0;width:32px;height:32px;border-radius:50%;background:var(--fg);color:#fff;font-size:16px;cursor:pointer;flex:none;display:grid;place-items:center;transition:opacity .15s}
#s:disabled{opacity:.25;cursor:default}
#fi{display:none}
@media(min-width:760px){body{max-width:820px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>

<header>
  <b>DeepSeek</b>
  <span class="sp"></span>
  <span id="dot" title="status"></span>
</header>

<main id="log"></main>

<footer>
  <div id="toggles">
    <button type="button" class="tg" id="tgThink">💭 Think</button>
    <button type="button" class="tg" id="tgSearch">🔍 Search</button>
  </div>
  <div id="chips"></div>
  <form id="f" autocomplete="off">
    <div class="row">
      <button type="button" id="clip" aria-label="Attach">📎</button>
      <textarea id="q" rows="1" placeholder="Message DeepSeek…" enterkeyhint="send"></textarea>
      <button id="s" type="submit" disabled aria-label="Send">↑</button>
    </div>
  </form>
  <input type="file" id="fi" multiple
    accept="image/*,.pdf,.txt,.md,.json,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx">
</footer>

<script>
(function(){
'use strict';

/* ===== CHANGE to your Render URL, no trailing slash ===== */
var API_BASE = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)
  ? 'http://localhost:3000'
  : 'https://deepseek-wrapper.onrender.com';

/* ---- session state (one chat per browser) ---- */
var SID_KEY = 'ds_sid';
var PID_KEY = 'ds_pid';
var sid = '';
var pid = '';
try { sid = localStorage.getItem(SID_KEY) || ''; } catch(e){}
try { pid = localStorage.getItem(PID_KEY) || ''; } catch(e){}

function saveSid(v){
  sid = v || '';
  try { sid ? localStorage.setItem(SID_KEY, sid)
            : localStorage.removeItem(SID_KEY); } catch(e){}
}
function savePid(v){
  pid = (v == null || v === '') ? '' : String(v);
  try { pid ? localStorage.setItem(PID_KEY, pid)
            : localStorage.removeItem(PID_KEY); } catch(e){}
}
function resetSession(){ saveSid(''); savePid(''); }

/* ---- tiny markdown ---- */
var ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'};
function esc(s){return s.replace(/[&<>"]/g,function(c){return ESC[c]})}
function md(src){
  src = String(src == null ? '' : src);
  var blocks=[];
  /* closed fenced code blocks */
  src = src.replace(/```[^\n`]*\n?([\s\S]*?)```/g, function(m, code){
    blocks.push('<div class="cb"><button class="cp" type="button">Copy</button><pre><code>'
      + esc(code.replace(/\n+$/,'')) + '</code></pre></div>');
    return '\u0001'+(blocks.length-1)+'\u0001';
  });
  /* still-open fence (mid-stream) */
  var oi = src.indexOf('```');
  if(oi !== -1){
    var rest = src.slice(oi);
    var nl = rest.indexOf('\n');
    var body = nl === -1 ? '' : rest.slice(nl+1);
    blocks.push('<div class="cb"><button class="cp" type="button">Copy</button><pre><code>'
      + esc(body.replace(/\n+$/,'')) + '</code></pre></div>');
    src = src.slice(0, oi) + '\u0001'+(blocks.length-1)+'\u0001';
  }

  function inl(t){return esc(t)
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s).,;:!?])/g,'$1<em>$2</em>')
    .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}

  var out=[],list=null;
  function flush(){if(list){out.push('<ul>'+list.join('')+'</ul>');list=null}}
  src.split('\n').forEach(function(line){
    var ph=line.match(/^\u0001(\d+)\u0001$/);
    if(ph){flush();out.push(blocks[+ph[1]]);return;}
    var li=line.match(/^\s*[-*]\s+(.*)$/);
    if(li){(list||(list=[])).push('<li>'+inl(li[1])+'</li>');return;}
    flush();
    var h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){var n=h[1].length;out.push('<h'+n+'>'+inl(h[2])+'</h'+n+'>');return;}
    if(!line.trim()){out.push('<div style="height:6px"></div>');return;}
    out.push('<p>'+inl(line)+'</p>');});
  flush();
  return out.join('').replace(/\u0001(\d+)\u0001/g,function(m,i){return blocks[+i]});
}

var log=document.getElementById('log'),frm=document.getElementById('f'),ta=document.getElementById('q'),
    snd=document.getElementById('s'),dot=document.getElementById('dot'),
    clip=document.getElementById('clip'),fi=document.getElementById('fi'),chips=document.getElementById('chips'),
    tgThink=document.getElementById('tgThink'),tgSearch=document.getElementById('tgSearch');

var thinkOn=false,searchOn=false;
tgThink.onclick=function(){thinkOn=!thinkOn;tgThink.classList.toggle('on',thinkOn)};
tgSearch.onclick=function(){searchOn=!searchOn;tgSearch.classList.toggle('on',searchOn)};

/* ---- copy buttons (event delegation) ---- */
log.addEventListener('click', function(e){
  var t = e.target;
  if(!t || !t.classList || !t.classList.contains('cp')) return;
  var pre = t.parentNode.querySelector('pre');
  var txt = pre ? pre.textContent : '';
  var done = function(){ t.textContent='Copied'; setTimeout(function(){ t.textContent='Copy'; },1200); };
  var fallback = function(){
    var x=document.createElement('textarea');
    x.value=txt; x.setAttribute('readonly','');
    x.style.position='fixed'; x.style.top='-1000px'; x.style.opacity='0';
    document.body.appendChild(x);
    x.select(); x.setSelectionRange(0, txt.length);
    try{ document.execCommand('copy'); }catch(_){}
    document.body.removeChild(x);
    done();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, fallback);
  } else {
    fallback();
  }
});

var attached=[];
function renderChips(){
  chips.innerHTML='';
  attached.forEach(function(f,i){
    var c=document.createElement('span');c.className='chip';
    c.textContent=(f.type.indexOf('image/')===0?'🖼️ ':'📄 ')+f.name;
    var b=document.createElement('button');b.type='button';b.textContent='✕';
    b.onclick=function(){attached.splice(i,1);renderChips();updSend()};
    c.appendChild(b);chips.appendChild(c);
  });
}
clip.onclick=function(){fi.click()};
fi.onchange=function(){
  Array.prototype.slice.call(fi.files).forEach(function(f){
    if(attached.length>=6)return;
    if(f.size>25*1024*1024)return;
    attached.push(f);
  });
  fi.value='';renderChips();updSend();
};

var cur=null,curResp='',curThink='',raf=0;
function sb(){log.scrollTop=log.scrollHeight}
function paint(){
  if(raf)return;
  raf=requestAnimationFrame(function(){
    raf=0;
    if(!cur)return;
    var r=cur.querySelector('.resp');if(r)r.innerHTML=md(curResp||'…');
    if(curThink){
      var t=cur.querySelector('.think');t.classList.add('on');t.textContent=curThink;
    }
    sb();
  });
}
function el(c,t){var d=document.createElement('div');d.className=c;if(t!=null)d.textContent=t;return d}
function addUser(t){log.appendChild(el('u',t));sb()}
function addErr(t){log.appendChild(el('err',t));sb()}
function startA(){
  cur=el('a');
  var th=document.createElement('div');th.className='think';
  var rp=document.createElement('div');rp.className='resp';rp.textContent='…';
  cur.appendChild(th);cur.appendChild(rp);
  log.appendChild(cur);
  curResp='';curThink='';
  sb();
}
function setStatus(k){dot.className=k==='working'?'w':k==='error'?'e':k==='ready'?'r':''}

var busy=false;
function updSend(){snd.disabled=busy||(!ta.value.trim()&&attached.length===0)}

async function send(){
  if(busy)return;
  var text=ta.value;
  if(!text.trim()&&attached.length===0)return;
  busy=true;updSend();setStatus('working');

  var fd=new FormData();
  fd.append('prompt',text);
  fd.append('thinking',thinkOn?'1':'0');
  fd.append('search',searchOn?'1':'0');
  if(sid)  fd.append('session_id', sid);
  if(pid)  fd.append('parent_message_id', pid);
  attached.forEach(function(f){fd.append('files',f,f.name)});

  var shown=text.trim()||'(file)';
  if(attached.length)shown+='\n['+attached.map(function(f){return f.name}).join(', ')+']';
  addUser(shown);

  attached=[];renderChips();
  ta.value='';ta.style.height='auto';

  var reader=null;
  startA();

  try{
    var r=await fetch(API_BASE + '/api/chat',{ method:'POST', body:fd });
    if(!r.ok||!r.body){
      var t=await r.text().catch(function(){return''});
      throw new Error('HTTP '+r.status+(t?' — '+t.slice(0,140):''));
    }
    reader=r.body.getReader();
    var dec=new TextDecoder(),buf='',finished=false;
    while(!finished){
      var ch=await reader.read();if(ch.done)break;
      buf+=dec.decode(ch.value,{stream:true});
      var i;
      while((i=buf.indexOf('\n\n'))!==-1){
        var fr=buf.slice(0,i);buf=buf.slice(i+2);
        if(fr.indexOf('data:')!==0)continue;
        var o;try{o=JSON.parse(fr.slice(5).trim())}catch(e){continue}
        if(o.reset) resetSession();
        if(o.sid) saveSid(o.sid);
        if(o.pid != null) savePid(o.pid);
        if(o.e) throw new Error(o.e);
        if(o.t){curThink+=o.t;paint()}
        if(o.r){curResp+=o.r;paint()}
        if(o.done)finished=true;
      }
    }
    if(!curResp){curResp='_(empty)_';paint()}
    setStatus('ready');
  }catch(e){
    if(reader){try{await reader.cancel()}catch(_){}}
    if(cur&&!curResp&&!curThink)cur.remove();
    addErr(String((e&&e.message)||e));setStatus('error');
  }finally{
    busy=false;updSend();ta.focus();
  }
}

ta.addEventListener('input',function(){
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,110)+'px';
  updSend();
});
ta.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();frm.requestSubmit()}
});
frm.addEventListener('submit',function(e){e.preventDefault();send()});

setStatus('ready');
ta.focus();
})();
</script>
</body>
</html>
